name: QOpenBB CodeQL

on:
  pull_request:
    branches: [qopenbb/baseline]
  push:
    branches: [qopenbb/baseline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out Workspace source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          threads: 2
          config: |
            name: QOpenBB Workspace
            paths:
              - backend-api
              - lite
              - terminalpro
            paths-ignore:
              - '**/node_modules/**'
              - '**/.venv/**'
              - '**/__pycache__/**'
      - name: Analyze and upload code scanning results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true
